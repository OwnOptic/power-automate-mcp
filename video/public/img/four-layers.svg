<text x="48" y="356" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#D5DEE8" text-anchor="start">Layers 1 and 2 are commodity: extras.py reuses them with one import line.</text>
