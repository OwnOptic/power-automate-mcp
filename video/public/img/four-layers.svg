<text x="806" y="156" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">What the API will never</text>
<text x="806" y="175" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">tell you</text>
<line x1="806" y1="204" x2="984" y2="204" stroke="#CBD5E1"/>
<text x="806" y="228" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F26F21" text-anchor="start">~200 lines</text>
<text x="806" y="248" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#F26F21" text-anchor="start">You. This is the moat.</text>
