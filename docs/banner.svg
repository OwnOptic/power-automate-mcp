<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392" viewBox="0 0 1280 392" role="img" aria-label="power-automate-mcp: an MCP server that lets Claude create, run and debug your Power Automate flows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A3B4E"/>
      <stop offset="100%" stop-color="#1b2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F26F21"/>
      <stop offset="100%" stop-color="#f9a26c"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="392" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 98H1280M0 196H1280M0 294H1280"/>
    <path d="M320 0V392M640 0V392M960 0V392"/>
  </g>

  <!-- orange rail -->
  <rect x="0" y="0" width="8" height="392" fill="url(#accent)"/>

  <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" fill="#ffffff">power-automate-mcp</text>
  <rect x="72" y="136" width="230" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="72" y="190" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#cbd5e1">An MCP server that lets Claude create, run and debug your Power Automate flows.</text>
  <text x="72" y="224" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#94a3b8">Ten tools. One file. MIT.</text>

  <!-- terminal motif -->
  <g transform="translate(72,262)">
    <rect x="0" y="0" width="700" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
    <circle cx="20" cy="18" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="4.5" fill="#eab308"/>
    <circle cx="52" cy="18" r="4.5" fill="#22c55e"/>
    <text x="20" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0"><tspan fill="#F26F21">&gt;</tspan> It failed. What happened?</text>
  </g>

  <!-- explain_run callout -->
  <g transform="translate(820,250)">
    <rect x="0" y="0" width="388" height="92" rx="10" fill="#F26F21" fill-opacity="0.12" stroke="#F26F21"/>
    <text x="22" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F26F21" font-weight="700">explain_run()</text>
    <text x="22" y="60" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">Compute_batches divided by batch_size,</text>
    <text x="22" y="80" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#cbd5e1">which Load_settings set to 0.</text>
  </g>

  <!-- arrow between -->
  <path d="M786 295 H812" stroke="#F26F21" stroke-width="2" marker-end="url(#head)"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F26F21"/>
    </marker>
  </defs>
</svg>
