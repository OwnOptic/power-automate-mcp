<text x="418" y="180" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F7A4D" text-anchor="start">The route that works</text>
<text x="388" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">GET api.powerapps.com/providers/</text>
<text x="388" y="223" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">Microsoft.PowerApps/connections</text>
<text x="388" y="240" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">?$filter=environment eq '&lt;env&gt;'</text>
<text x="388" y="261" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Token audience: service.powerapps.com</text>
<text x="388" y="279" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Returns 200 and the full list, including</text>
<text x="388" y="297" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">connections no flow uses yet.</text>
<text x="388" y="315" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Only Connected ones are kept.</text>
<path d="M672 252H716" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrg)"/>
<text x="694" y="242" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5B6B7C" text-anchor="middle">fails</text>
<rect x="720" y="150" width="300" height="204" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<g transform="translate(734 162) scale(1.0)"><path d="M6.5 7V17M6.5 13C6.5 10.5 8.5 9.5 11 9.5H13.5C15.7 9.5 17.5 8.5 17.5 7" stroke="url(#i5_cx_branch_line)" stroke-width="2" stroke-linecap="round" fill="none"/>
<circle cx="6.5" cy="5.5" r="2.6" fill="url(#i5_cx_branch_a)"/><circle cx="6.5" cy="18.5" r="2.6" fill="url(#i5_cx_branch_b)"/><circle cx="17.5" cy="5.5" r="2.6" fill="url(#i5_cx_branch_c)"/>
<defs><linearGradient id="i5_cx_branch_line" x1="6" y1="5" x2="18" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#E3E8EF"/><stop offset="1" stop-color="#AEB9C7"/></linearGradient><linearGradient id="i5_cx_branch_a" x1="4" y1="3" x2="9" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#29C3FF"/><stop offset="1" stop-color="#2764E7"/></linearGradient><linearGradient id="i5_cx_branch_b" x1="4" y1="16" x2="9" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#52D17C"/><stop offset="1" stop-color="#1FA254"/></linearGradient><linearGradient id="i5_cx_branch_c" x1="15" y1="3" x2="20" y2="8" gradientUnits="userSpaceOnUse"><stop stop-color="#FFC470"/><stop offset="1" stop-color="#F26F21"/></linearGradient></defs></g>
<text x="766" y="180" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2A3B4E" text-anchor="start">Fallback</text>
<text x="736" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">GET /flows, then for each flow</text>
<text x="736" y="223" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">GET /flows/{id}/connections</text>
<text x="736" y="244" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Used only when that call fails.</text>
<text x="736" y="262" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Unions what the flows reference,</text>
<text x="736" y="280" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">so a connection that no flow</text>
<text x="736" y="298" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">uses yet stays invisible.</text>
<path d="M522 354V390" stroke="#F26F21" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="24" y="394" width="996" height="56" rx="10" fill="#2A3B4E"/>
<rect x="24" y="394" width="6" height="56" rx="3" fill="#F26F21"/>
<text x="48" y="418" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="start">bind_connection binds a connection created in the portal a minute ago.</text>
<text x="48" y="438" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#D5DEE8" text-anchor="start">create_flow lists missing_connections, each with a link to the portal Connections page.</text>
</svg>
