<text x="40" y="206" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">GET /environments/{env}/connections</text>
<text x="40" y="227" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">Under ProcessSimple and PowerApps</text>
