<text x="70" y="280" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#B42318" text-anchor="start">Closed: 403 InvalidPath</text>
<text x="40" y="306" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">GET api.powerapps.com/.../</text>
<text x="40" y="323" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="500" fill="#2A3B4E" text-anchor="start">environments/{env}/connections</text>
<text x="40" y="344" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6B7C" text-anchor="start">With a Flow token</text>
